<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>折面投影台</title>
<style>
:root{
  --bg:#0c0b10; --panel:#15141b; --line:#2a2833; --fg:#e9e7ef; --mute:#9a96a8;
  --acc:#e8ef3c; --acc2:#e0368f; --ok:#5fe3d6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.45 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
#app{display:flex;height:100%}
#side{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  overflow:auto;padding:12px 12px 40px}
#side h1{font-size:17px;margin:0 0 2px;letter-spacing:.06em}
#side h1 b{color:var(--acc)}
#side .sub{color:var(--mute);font-size:12px;margin-bottom:10px}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:8px 10px 10px}
legend{color:var(--acc);font-size:12px;padding:0 4px;letter-spacing:.08em}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:5px 0}
.row label{color:var(--mute);font-size:12px;min-width:52px}
button,select,input[type=text],input[type=number]{
  background:#1f1d27;color:var(--fg);border:1px solid #363343;border-radius:6px;
  padding:5px 9px;font:inherit;font-size:13px}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#111;border-color:var(--acc)}
button.wide{flex:1}
input[type=number]{width:70px}
input[type=text]{width:100%}
input[type=range]{flex:1}
input[type=color]{width:34px;height:28px;border:1px solid #363343;background:#1f1d27;border-radius:6px;padding:2px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1}
.hint{color:var(--mute);font-size:12px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#stageWrap{flex:1;position:relative;background:#050407;min-height:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#seek{flex:1;min-width:160px}
#tc{font-variant-numeric:tabular-nums;color:var(--mute);min-width:150px;font-size:12px}
#build{color:#6f6b7d;font-size:11px;padding:0 10px 6px;background:var(--panel)}
.segs{display:grid;grid-template-columns:1fr 64px;gap:4px 6px;align-items:center}
.segs span{font-size:12px;color:var(--mute)}
body.out #side,body.out #bar,body.out #build{display:none}
body.side-hidden #side{display:none}
#bar .main{font-weight:700}
.nudge button{min-width:40px}
#btnFactory2{border-color:#7a3a52}
#autoHint.new{color:var(--acc)}
#btnAuto.new{background:var(--acc);color:#111;border-color:var(--acc)}
body.out #stageWrap{background:#000}
@media (max-width:760px){
  #app{flex-direction:column}
  #side{width:auto;max-height:45vh;border-right:0;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>折面<b>投影台</b></h1>
    <div class="sub">把動畫依節拍「貼」到立體牆的每一個面上</div>

    <fieldset>
      <legend>畫面</legend>
      <div class="tabs" id="viewTabs">
        <button data-v="edit">編輯</button>
        <button data-v="sim">模擬牆面</button>
        <button data-v="out">投影輸出</button>
      </div>
      <div class="row">
        <button class="wide" id="btnOutWin">開啟投影視窗（第二螢幕）</button>
      </div>
      <div class="row"><label>牆面照片</label><input type="file" id="bgFile" accept="image/*" style="width:180px"></div>
      <div class="row"><label>照片透明</label><input type="range" id="bgAlpha" min="0" max="1" step="0.05"></div>
      <div id="autoBox" style="display:none">
        <div class="hint" id="autoHint">照片已載入：可以讓程式自動找出牆上的面。</div>
        <div class="row"><button id="btnAuto" class="wide">✦ 自動偵測面</button><button id="btnAutoRe">重新偵測</button></div>
        <div class="row"><label>細緻度</label><span class="hint">少</span><input type="range" id="autoDetail" min="1" max="10" step="1" value="5"><span class="hint">多</span></div>
        <div class="row" id="autoApplyRow" style="display:none"><button id="btnAutoApply" class="wide">套用（取代目前的面）</button><button id="btnAutoCancel">取消</button></div>
        <div class="hint" id="autoStatus"></div>
      </div>
      <div class="row"><label>環境光</label><input type="checkbox" id="ambient"><span class="hint">模擬現場彩色燈</span></div>
    </fieldset>

    <fieldset>
      <legend>編輯對象</legend>
      <div class="tabs" id="editTabs">
        <button data-e="facet">牆面多邊形</button>
        <button data-e="layer">貼合圖層</button>
      </div>
      <div id="facetTools">
        <div class="row">
          <button id="btnAddFacet" class="wide">＋ 新增面（點擊描點）</button>
        </div>
        <div class="row" id="addTools" style="display:none">
          <button id="btnUndoPt">↶ 復原上一點</button>
          <button id="btnFinish" class="wide">✓ 完成這個面</button>
          <button id="btnCancelAdd">取消</button>
        </div>
        <div class="row nudge" id="nudgeRow">
          <span class="hint" id="nudgeInfo">點一下頂點選取，再用方向鍵微調：</span>
          <button data-n="-1,0">←</button><button data-n="0,-1">↑</button><button data-n="0,1">↓</button><button data-n="1,0">→</button>
          <label class="hint"><input type="checkbox" id="nudgeBig">一次 10 格</label>
        </div>
        <div class="row">
          <button id="btnDelFacet" class="wide">刪除選取的面</button>
          <button id="btnClearFacets">全部清空</button>
        </div>
        <div class="hint">拖曳頂點可校正位置，相鄰面共用的點會一起移動。新增時點回第一點、或按「完成這個面」收合。</div>
      </div>
      <div id="layerTools" style="display:none">
        <div class="row"><select id="layerSel" style="flex:1"></select></div>
        <div class="row">
          <button id="btnAddText">＋ 文字</button>
          <button id="btnAddImg">＋ 圖片</button>
          <button id="btnDelLayer">刪除</button>
        </div>
        <input type="file" id="imgFile" accept="image/*" style="display:none">
        <div class="row" id="rowText"><label>文字</label><input type="text" id="layerText"></div>
        <div class="row"><label>顏色</label><input type="color" id="layerColor"><label>出場段落</label>
          <select id="layerStage">
            <option value="char">角色</option><option value="title">標題</option><option value="fill">填色</option><option value="lines">線稿</option>
          </select></div>
        <div class="row"><label>手繪抖動</label><input type="range" id="layerBoil" min="0" max="6" step="0.5"></div>
        <div class="hint">拖四個角做透視校正，拖中間整塊移動。</div>
      </div>
    </fieldset>

    <fieldset>
      <legend>節奏與段落（拍）</legend>
      <div class="row"><label>BPM</label><input type="number" id="bpm" min="40" max="220" step="1"><button id="btnTap">點拍子</button></div>
      <div class="segs" id="segs"></div>
      <div class="row"><label>配色</label><span id="palette" style="display:flex;gap:4px"></span></div>
    </fieldset>

    <fieldset>
      <legend>音樂</legend>
      <div class="row"><input type="file" id="audioFile" accept="audio/*" style="width:100%"></div>
      <div class="row"><button id="btnMic" class="wide">用麥克風抓節拍</button></div>
      <div class="hint" id="audioInfo">未載入音樂：用 BPM 產生節拍。</div>
    </fieldset>

    <fieldset>
      <legend>存檔</legend>
      <div class="row">
        <button id="btnExport" class="wide">匯出設定</button>
        <button id="btnImport" class="wide">匯入設定</button>
        <input type="file" id="importFile" accept=".json,application/json" style="display:none">
      </div>
      <div class="row">
        <button id="btnRec" class="wide">錄下畫面（WebM）</button>
        <button id="btnReset">載入範例</button>
      </div>
      <div class="row"><button id="btnFactory" class="wide">↺ 回到初始狀態（清除所有設定）</button></div>
    </fieldset>
  </aside>

  <main id="main">
    <div id="stageWrap"><canvas id="view"></canvas></div>
    <div id="bar">
      <button id="btnSide" class="main">☰ 設定</button>
      <button id="btnPlay">▶ 播放</button>
      <button id="btnRew">⏮ 從頭</button>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span id="tc">0.00 s</span>
      <span id="segJump" style="display:flex;gap:4px"></span>
      <button id="btnFull" title="全螢幕">⛶</button>
      <button id="btnFactory2" title="回到初始狀態">↺ 重設</button>
    </div>
    <div id="build">reel2 build 2026-10-03 r3 · 折面投影台 · 純本機 Canvas 2D，無外部套件</div>
  </main>
</div>

<script>
'use strict';
const BUILD = 'reel2 build 2026-10-03 r3';
const qs = new URLSearchParams(location.search);
const IS_OUT = location.hash === '#out';
if (IS_OUT) document.body.classList.add('out');

/* ---------- 小工具 ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- 範例場景 ---------- */
const STAGES = [
  ['dark', '暗場'], ['lines', '線稿描繪'], ['fill', '色塊填充'], ['char', '角色登場'], ['title', '標題字卡'], ['out', '收尾']
];
function demoState() {
  const V = {
    A: [430, 140], B: [640, 90], C: [860, 120], D: [1060, 170], E: [1180, 300],
    F: [520, 300], G: [720, 260], H: [930, 290], I: [1090, 400],
    J: [470, 470], K: [660, 450], L: [860, 480], M: [1020, 560],
    N: [600, 640], O: [820, 660]
  };
  const f = (s, i) => ({ id: 'f' + i, pts: s.split('').map(k => V[k].slice()) });
  return {
    v: 1, res: [1280, 720], bpm: 128,
    beats: { dark: 2, lines: 12, fill: 12, char: 12, title: 8, out: 2 },
    palette: ['#e0368f', '#5fe3d6', '#e9ee3c', '#8a3bd1'],
    line: '#e8ef3c',
    facets: ['ABF', 'BGF', 'BCG', 'CHG', 'CDH', 'DEIH', 'AFJ', 'FGKJ', 'GHLK', 'HIML', 'JKN', 'KLON', 'LMO'].map(f),
    layers: [
      { id: 'L1', type: 'img', name: '角色插畫', src: '', stage: 'char', color: '#ffffff', boil: 2.5,
        q: [[585, 130], [905, 170], [890, 480], [600, 450]] },
      { id: 'L2', type: 'text', name: '狀聲字', text: '嘩啊！', stage: 'char', color: '#ffffff', boil: 2,
        q: [[890, 320], [1090, 360], [1078, 470], [880, 435]] },
      { id: 'L3', type: 'text', name: '標題', text: '閃電落下', stage: 'title', color: '#ff2a4a', boil: 0,
        q: [[430, 470], [840, 425], [860, 665], [465, 690]] }
    ],
    bg: '', bgAlpha: 0.5, ambient: true
  };
}

/* ---------- 狀態 / 儲存 ---------- */
const LS = 'reel2.facetstage.v1';
let S;
function loadState() {
  try { const j = JSON.parse(localStorage.getItem(LS) || 'null'); if (j && j.v === 1) return j; } catch (e) {}
  return demoState();
}
let saveTimer = 0;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { console.warn('儲存失敗（可能圖片太大）', e); }
    broadcast({ kind: 'state', S });
  }, 150);
}
S = qs.has('demo') ? demoState() : loadState();

/* ---------- 跨視窗同步 ---------- */
let bc = null;
try { bc = new BroadcastChannel('reel2-facetstage'); } catch (e) {}
function broadcast(m) { try { bc && bc.postMessage(m); } catch (e) {} }

/* ---------- 時鐘 ---------- */
const clock = { playing: false, base: 0, at: 0 };
const audio = new Audio(); audio.loop = true;
let audioOn = false;
function now() {
  if (audioOn && !audio.paused) return audio.currentTime;
  return clock.playing ? clock.base + (performance.now() - clock.at) / 1000 : clock.base;
}
function totalBeats() { return STAGES.reduce((s, [k]) => s + (+S.beats[k] || 0), 0) || 1; }
function loopSec() { return totalBeats() * 60 / S.bpm; }
function setTime(t) {
  clock.base = t; clock.at = performance.now();
  if (audioOn) { try { audio.currentTime = t % (audio.duration || 1e9); } catch (e) {} }
  sendClock();
}
function play(on) {
  const t = now();
  clock.playing = on; clock.base = t; clock.at = performance.now();
  if (audioOn) { on ? audio.play().catch(() => {}) : audio.pause(); }
  document.getElementById('btnPlay').textContent = on ? '⏸ 暫停' : '▶ 播放';
  sendClock();
}
function sendClock() { broadcast({ kind: 'clock', playing: clock.playing, t: now(), sent: Date.now() }); }

/* ---------- 節拍偵測 ---------- */
let actx = null, analyser = null, freq = null, energyAvg = 0, kick = 0, lastKick = 0;
function ensureCtx() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
function attachAnalyser(node) {
  analyser = actx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.5;
  node.connect(analyser); freq = new Uint8Array(analyser.frequencyBinCount);
}
function audioPulse(dt) {
  if (!analyser) return null;
  analyser.getByteFrequencyData(freq);
  let e = 0; for (let i = 1; i < 10; i++) e += freq[i]; e /= 9 * 255;
  energyAvg = lerp(energyAvg, e, 0.04);
  const t = performance.now();
  if (e > energyAvg * 1.25 + 0.04 && t - lastKick > 180) { kick = 1; lastKick = t; }
  kick = Math.max(0, kick - dt * 4);
  return kick;
}

/* ---------- 時間 → 段落 ---------- */
function timeline(t) {
  const tb = totalBeats();
  let b = (t * S.bpm / 60) % tb; if (b < 0) b += tb;
  const st = {}; let acc = 0, cur = 'dark', curP = 0;
  for (const [k] of STAGES) {
    const d = +S.beats[k] || 0;
    st[k] = d > 0 ? clamp((b - acc) / d) : (b >= acc ? 1 : 0);
    st[k + 'Start'] = acc;
    if (b >= acc && b < acc + d) { cur = k; curP = (b - acc) / d; }
    acc += d;
  }
  return { b, st, cur, curP };
}

/* ---------- 幾何 ---------- */
function centroid(p) { let x = 0, y = 0; for (const q of p) { x += q[0]; y += q[1]; } return [x / p.length, y / p.length]; }
function polyPath(ctx, p) { ctx.beginPath(); p.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath(); }
function inPoly(pt, p) {
  let c = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const [xi, yi] = p[i], [xj, yj] = p[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function longestEdgeAngle(p) {
  let best = 0, ang = 0;
  for (let i = 0; i < p.length; i++) {
    const a = p[i], b = p[(i + 1) % p.length], d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (d > best) { best = d; ang = Math.atan2(b[1] - a[1], b[0] - a[0]); }
  }
  return ang;
}
function radius(p, c) { return Math.max(...p.map(q => Math.hypot(q[0] - c[0], q[1] - c[1]))); }

/* 透視（Homography）：把單位矩形映到任意四邊形 */
function solve(A, b) {
  const n = b.length;
  for (let i = 0; i < n; i++) {
    let m = i; for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[m][i])) m = r;
    [A[i], A[m]] = [A[m], A[i]]; [b[i], b[m]] = [b[m], b[i]];
    for (let r = i + 1; r < n; r++) { const f = A[r][i] / A[i][i]; for (let c = i; c < n; c++) A[r][c] -= f * A[i][c]; b[r] -= f * b[i]; }
  }
  const x = new Array(n);
  for (let i = n - 1; i >= 0; i--) { let s = b[i]; for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c]; x[i] = s / A[i][i]; }
  return x;
}
function homography(src, dst) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
  }
  const h = solve(A, b); h.push(1); return h;
}
const hApply = (h, x, y) => { const w = h[6] * x + h[7] * y + h[8]; return [(h[0] * x + h[1] * y + h[2]) / w, (h[3] * x + h[4] * y + h[5]) / w]; };

function drawTri(ctx, img, s0, s1, s2, d0, d1, d2) {
  const c = [(d0[0] + d1[0] + d2[0]) / 3, (d0[1] + d1[1] + d2[1]) / 3];
  const g = d => { const dx = d[0] - c[0], dy = d[1] - c[1], l = Math.hypot(dx, dy) || 1; return [d[0] + dx / l * 0.9, d[1] + dy / l * 0.9]; };
  const e0 = g(d0), e1 = g(d1), e2 = g(d2);
  ctx.save();
  ctx.beginPath(); ctx.moveTo(e0[0], e0[1]); ctx.lineTo(e1[0], e1[1]); ctx.lineTo(e2[0], e2[1]); ctx.closePath(); ctx.clip();
  const du1 = s1[0] - s0[0], dv1 = s1[1] - s0[1], du2 = s2[0] - s0[0], dv2 = s2[1] - s0[1];
  const dx1 = d1[0] - d0[0], dy1 = d1[1] - d0[1], dx2 = d2[0] - d0[0], dy2 = d2[1] - d0[1];
  const det = du1 * dv2 - du2 * dv1; if (Math.abs(det) < 1e-9) { ctx.restore(); return; }
  const a = (dx1 * dv2 - dx2 * dv1) / det, cc = (dx2 * du1 - dx1 * du2) / det;
  const b = (dy1 * dv2 - dy2 * dv1) / det, d = (dy2 * du1 - dy1 * du2) / det;
  const e = d0[0] - a * s0[0] - cc * s0[1], f = d0[1] - b * s0[0] - d * s0[1];
  ctx.transform(a, b, cc, d, e, f);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}
function drawWarped(ctx, img, quad, N = 10) {
  const iw = img.width, ih = img.height;
  const h = homography([[0, 0], [iw, 0], [iw, ih], [0, ih]], quad);
  const P = [];
  for (let j = 0; j <= N; j++) { P[j] = []; for (let i = 0; i <= N; i++) P[j][i] = hApply(h, iw * i / N, ih * j / N); }
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const s00 = [iw * i / N, ih * j / N], s10 = [iw * (i + 1) / N, ih * j / N], s01 = [iw * i / N, ih * (j + 1) / N], s11 = [iw * (i + 1) / N, ih * (j + 1) / N];
    drawTri(ctx, img, s00, s10, s11, P[j][i], P[j][i + 1], P[j + 1][i + 1]);
    drawTri(ctx, img, s00, s11, s01, P[j][i], P[j + 1][i + 1], P[j + 1][i]);
  }
}

/* ---------- 每個面的內容 ---------- */
function facetDecor(f, idx) {
  const r = rng(hashStr(f.id) ^ (idx * 7919));
  const kinds = ['grid', 'hatch', 'zig', 'grid', 'tri'];
  return {
    pattern: kinds[Math.floor(r() * kinds.length)],
    spacing: 15 + Math.floor(r() * 9),
    col: Math.floor(r() * 4),
    col2: Math.floor(r() * 4),
    shardY: (r() - 0.5) * 0.6, shardAmp: 0.12 + r() * 0.16, shardTeeth: 3 + Math.floor(r() * 4), shardW: 0.16 + r() * 0.18,
    stripes: r() < 0.45, wipe: r() * Math.PI * 2, mode: (m => m < 0.18 ? 'keep' : m < 0.6 ? 'shard' : 'full')(r())
  };

function imgSize(src) { return new Promise(res => { const im = new Image(); im.onload = () => res([im.naturalWidth, im.naturalHeight]); im.onerror = () => res([1, 1]); im.src = src; }); }
// two-tap confirmation (window.confirm is blocked in sandboxed frames and is clumsy on phones)
function armed(btn, label) {

  btn.dataset.label = btn.textContent; btn.textContent = label;
  btn.dataset.armed = setTimeout(() => { delete btn.dataset.armed; btn.textContent = btn.dataset.label; }, 3000);
  return false;
}
function factoryReset() {
  try { localStorage.removeItem(LS); } catch (e) {}
  S = demoState(); selFacet = selLayer = null; selVert = null; adding = null; drag = null; autoPrev = null;
  document.getElementById('btnAddFacet').classList.remove('on');
  syncAll(); syncAddUI(); syncNudge(); setView('sim'); setEdit('facet'); setTime(0); saveState();
}
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Escape') { adding = null; document.getElementById('btnAddFacet').classList.remove('on'); syncAddUI(); }
  else if (selVert && e.key.startsWith('Arrow')) { e.preventDefault(); nudge(e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0, e.key === 'ArrowUp' ? -1 : e.key === 'ArrowDown' ? 1 : 0); }
  else if (e.key === 'Enter' && adding) finishAdd();
  else if ((e.key === 'Delete' || e.key === 'Backspace') && EDIT === 'facet' && selFacet) delFacet();
  else if (e.key === ' ') { e.preventDefault(); play(!clock.playing && !(audioOn && !audio.paused)); }
});
function delFacet() { S.facets = S.facets.filter(f => f.id !== selFacet); selFacet = null; selVert = null; syncNudge(); saveState(); }

function drawOverlay(ctx) {
  ctx.save();
  ctx.translate(fit.ox, fit.oy); ctx.scale(fit.s, fit.s);
  const px = 1 / fit.s;
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = px; ctx.strokeRect(0, 0, S.res[0], S.res[1]);
  if (EDIT === 'facet' && autoPrev) { /* 預覽偵測結果時先藏起目前的面，避免兩組線疊在一起 */ }
  else if (EDIT === 'facet') {
    S.facets.forEach(f => {
      polyPath(ctx, f.pts);
      ctx.strokeStyle = f.id === selFacet ? '#5fe3d6' : 'rgba(255,255,255,.55)';
      ctx.lineWidth = (f.id === selFacet ? 2.5 : 1.2) * px; ctx.stroke();
      if (f.id === selFacet) { ctx.fillStyle = 'rgba(95,227,214,.12)'; ctx.fill(); }
    });
    const d = DPR();
    for (const p of allVerts()) { const on = selVert && selVert.includes(p); ctx.fillStyle = on ? '#5fe3d6' : '#fff'; ctx.beginPath(); ctx.arc(p[0], p[1], (on ? 9 : 6) * d * px, 0, 7); ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5 * d * px; ctx.stroke(); }
    if (adding) {
      ctx.strokeStyle = '#e8ef3c'; ctx.lineWidth = 2 * px; ctx.setLineDash([6 * px, 5 * px]);
      ctx.beginPath(); adding.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      if (hover) ctx.lineTo(hover[0], hover[1]); ctx.stroke(); ctx.setLineDash([]);
      adding.forEach((p, i) => { ctx.fillStyle = i === 0 && adding.length >= 3 ? '#5fe3d6' : '#e8ef3c'; ctx.beginPath(); ctx.arc(p[0], p[1], (i === 0 && adding.length >= 3 ? 12 : 6) * DPR() * px, 0, 7); ctx.fill(); });
    }
  } else {
    S.layers.forEach(L => {
      polyPath(ctx, L.q); const on = L.id === selLayer;
      ctx.strokeStyle = on ? '#e0368f' : 'rgba(255,255,255,.35)'; ctx.lineWidth = (on ? 2.5 : 1) * px;
      ctx.setLineDash(on ? [] : [5 * px, 5 * px]); ctx.stroke(); ctx.setLineDash([]);
      if (on) L.q.forEach((p, i) => {
        ctx.fillStyle = '#e0368f'; ctx.beginPath(); ctx.arc(p[0], p[1], 9 * DPR() * px, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = `${11 * px}px sans-serif`; ctx.fillText(['左上', '右上', '右下', '左下'][i], p[0] + 9 * px, p[1] - 9 * px);
      });
    });
  }
  ctx.restore();
}

let autoPrev = null, autoBusy = false;
const AUTO_COLS = ['#e0368f', '#5fe3d6', '#e9ee3c', '#8a3bd1', '#ff8a3c', '#4c8dff'];
function drawAutoPreview(ctx) {
  ctx.save(); ctx.translate(fit.ox, fit.oy); ctx.scale(fit.s, fit.s);
  const px = 1 / fit.s, d = DPR();
  autoPrev.forEach((P, i) => {
    polyPath(ctx, P); ctx.globalAlpha = 0.28; ctx.fillStyle = AUTO_COLS[i % AUTO_COLS.length]; ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = AUTO_COLS[i % AUTO_COLS.length]; ctx.lineWidth = 2.5 * d * px; ctx.setLineDash([7 * d * px, 4 * d * px]); ctx.stroke(); ctx.setLineDash([]);
  });
  ctx.fillStyle = '#fff';
  for (const P of autoPrev) for (const p of P) { ctx.beginPath(); ctx.arc(p[0], p[1], 4 * d * px, 0, 7); ctx.fill(); }
  ctx.restore();
}
function syncAutoUI() {
  const box = document.getElementById('autoBox'); if (!box) return;
  box.style.display = S.bg ? '' : 'none';
  document.getElementById('autoApplyRow').style.display = autoPrev ? '' : 'none';
  document.getElementById('btnAutoRe').disabled = autoBusy;
  document.getElementById('btnAuto').disabled = autoBusy;
}
async function runAuto() {
  if (!S.bg || autoBusy) return;
  autoBusy = true; syncAutoUI();
  const st = document.getElementById('autoStatus');
  document.getElementById('autoHint').classList.remove('new'); document.getElementById('btnAuto').classList.remove('new');
  try {
    const det = +document.getElementById('autoDetail').value;
    const r = await detectFacets(S.bg, det, m => { st.textContent = m; });
    autoPrev = r.polys; window.__autoLast = { count: r.polys.length, ms: r.ms, w: r.w, h: r.h, superpixels: r.superpixels, regions: r.regions, detail: det, noise: r.noise, T: r.T };
    st.textContent = r.polys.length ? `找到 ${r.polys.length} 個面（${r.ms} ms）。虛線是預覽，確認後按「套用」；不滿意可調細緻度再偵測。` : '沒找到明顯的平面：試試調高細緻度，或改用「新增面」手動描。';
    setView('edit');
  } catch (err) { st.textContent = '偵測失敗：' + err.message; console.error(err); }
  autoBusy = false; syncAutoUI();
}

/* ---------- 主迴圈 ---------- */
let FREEZE = qs.has('t') ? +qs.get('t') : null;
window.__setT = t => { FREEZE = t; };
let lastFrame = performance.now(), recorder = null;
function frame() {
  const nowMs = performance.now(), dt = Math.min(0.1, (nowMs - lastFrame) / 1000); lastFrame = nowMs;
  const t = FREEZE !== null ? FREEZE : now();
  const ap = audioPulse(dt);
  const T = timeline(t);
  const beatPulse = Math.exp(-(T.b % 1) * 5);
  const pulse = ap !== null ? Math.max(ap, beatPulse * 0.25) : beatPulse;
  const C = renderComposite(t, pulse, VIEW);
  // 顯示
  const W = view.width, H = view.height;
  vctx.setTransform(1, 0, 0, 1, 0, 0);
  vctx.fillStyle = IS_OUT ? '#000' : '#050407'; vctx.fillRect(0, 0, W, H);
  const s = Math.min(W / S.res[0], H / S.res[1]); fit = { s, ox: (W - S.res[0] * s) / 2, oy: (H - S.res[1] * s) / 2 };
  vctx.imageSmoothingQuality = 'high';
  vctx.drawImage(C, fit.ox, fit.oy, S.res[0] * s, S.res[1] * s);
  if (VIEW === 'edit' && !IS_OUT) drawOverlay(vctx);
  if (autoPrev && !IS_OUT) drawAutoPreview(vctx);
  if (!IS_OUT) {
    const L = loopSec(), tl = ((t % L) + L) % L;
    if (!seeking) document.getElementById('seek').value = Math.round(tl / L * 1000);
    const name = (STAGES.find(x => x[0] === T.cur) || [, ''])[1];
    document.getElementById('tc').textContent = `${tl.toFixed(2)} / ${L.toFixed(2)} s · 第 ${Math.floor(T.b) + 1} 拍 · ${name}`;
  }
  window.__reel2 = { t, beat: T.b, stage: T.cur, facets: S.facets.length, layers: S.layers.length, build: BUILD, auto: autoPrev ? autoPrev.length : 0 };
  requestAnimationFrame(frame);
}

/* ---------- 側欄 UI ---------- */
const $ = id => document.getElementById(id);
let seeking = false;
function setView(v) { VIEW = v; document.querySelectorAll('#viewTabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
function setEdit(m) {
  EDIT = m; document.querySelectorAll('#editTabs button').forEach(b => b.classList.toggle('on', b.dataset.e === m));
  $('facetTools').style.display = m === 'facet' ? '' : 'none'; $('layerTools').style.display = m === 'layer' ? '' : 'none';
  if (m === 'layer' && !selLayer && S.layers[0]) selLayer = S.layers[0].id;
  syncLayerUI();
}
function syncLayerUI() {
  const sel = $('layerSel'); sel.innerHTML = '';
  S.layers.forEach(L => { const o = document.createElement('option'); o.value = L.id; o.textContent = (L.type === 'img' ? '🖼 ' : '字 ') + (L.name || L.text || '圖層'); sel.appendChild(o); });
  const L = curLayer(); if (!L) return;
  sel.value = L.id;
  $('rowText').style.display = L.type === 'text' ? '' : 'none';
  $('layerText').value = L.text || ''; $('layerColor').value = L.color || '#ffffff';

}
function buildSegs() {
  const box = $('segs'); box.innerHTML = '';
  STAGES.forEach(([k, name]) => {
    const sp = document.createElement('span'); sp.textContent = name; box.appendChild(sp);
    const inp = document.createElement('input'); inp.type = 'number'; inp.min = 0; inp.max = 64; inp.value = S.beats[k];
    inp.oninput = () => { S.beats[k] = Math.max(0, +inp.value || 0); saveState(); };
    box.appendChild(inp);
  });
  const pj = $('segJump'); pj.innerHTML = '';
  STAGES.slice(1, 5).forEach(([k, name]) => {
    const b = document.createElement('button'); b.textContent = name;
    b.onclick = () => { const T = timeline(0); setTime((T.st[k + 'Start'] + 0.01) * 60 / S.bpm); };
    pj.appendChild(b);
  });
  const pal = $('palette'); pal.innerHTML = '';
  S.palette.forEach((col, i) => {
    const inp = document.createElement('input'); inp.type = 'color'; inp.value = col;
    inp.oninput = () => { S.palette[i] = inp.value; saveState(); }; pal.appendChild(inp);
  });
  const ln = document.createElement('input'); ln.type = 'color'; ln.value = S.line; ln.title = '線稿顏色';
  ln.oninput = () => { S.line = ln.value; saveState(); }; pal.appendChild(ln);
}
function syncAll() {
  syncAutoUI();
  $('bpm').value = S.bpm; $('bgAlpha').value = S.bgAlpha; $('ambient').checked = !!S.ambient;
  buildSegs(); syncLayerUI();
}
function readFile(file) { return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); }); }
function shrinkImage(dataUrl, max = 1280) {
  return new Promise(res => {
    const im = new Image(); im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)); const cv = document.createElement('canvas');
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      res(cv.toDataURL(dataUrl.startsWith('data:image/png') ? 'image/png' : 'image/jpeg', 0.88));
    }; im.src = dataUrl;
  });
}

if (!IS_OUT) {
  document.querySelectorAll('#viewTabs button').forEach(b => b.onclick = () => setView(b.dataset.v));
  document.querySelectorAll('#editTabs button').forEach(b => b.onclick = () => { setEdit(b.dataset.e); setView('edit'); });
  $('btnOutWin').onclick = () => { window.open(location.pathname + location.search.replace(/[?&]t=[^&]*/, '') + '#out', 'reel2-out', 'width=1280,height=720'); setTimeout(() => { broadcast({ kind: 'state', S }); sendClock(); }, 800); };
  $('bgFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    S.bg = await shrinkImage(await readFile(f), 1600);
    const [iw, ih] = await imgSize(S.bg);
    setRes(iw >= ih ? 1280 : Math.round(1280 * iw / ih), iw >= ih ? Math.round(1280 * ih / iw) : 1280);
    autoPrev = null; saveState(); setView('edit'); syncAutoUI();
    $('autoHint').textContent = '照片已載入 → 按「✦ 自動偵測面」讓程式找出牆上的面（也可以手動描）。';
    $('autoHint').classList.add('new'); $('btnAuto').classList.add('new'); $('autoStatus').textContent = '';
  };
  $('btnAuto').onclick = () => runAuto();
  $('btnAutoRe').onclick = () => runAuto();
  let autoT = 0;
  $('autoDetail').oninput = () => { if (autoPrev) { clearTimeout(autoT); autoT = setTimeout(runAuto, 350); } };
  $('btnAutoApply').onclick = e => {
    if (!autoPrev) return;
    if (S.facets.length && !armed(e.currentTarget, '再按一次：取代目前的面')) return;
    S.facets = autoPrev.map(P => ({ id: uid(), pts: P.map(p => p.slice()) }));
    const n = S.facets.length;
    autoPrev = null; selFacet = null; selVert = null; syncNudge();
    setEdit('facet'); setView('edit'); saveState(); syncAutoUI();
    $('autoStatus').textContent = `已套用 ${n} 個面。拖頂點或用方向鍵微調，相鄰面的共用角會一起動。`;
  };
  $('btnAutoCancel').onclick = () => { autoPrev = null; syncAutoUI(); $('autoStatus').textContent = '已取消預覽。'; };
  $('bgAlpha').oninput = e => { S.bgAlpha = +e.target.value; saveState(); };
  $('ambient').onchange = e => { S.ambient = e.target.checked; saveState(); };
  $('btnAddFacet').onclick = () => { setEdit('facet'); setView('edit'); adding = []; selVert = null; $('btnAddFacet').classList.add('on'); syncAddUI(); syncNudge();
    if (document.body.classList.contains('narrow')) { document.body.classList.add('side-hidden'); requestAnimationFrame(resize); } };
  $('btnUndoPt').onclick = () => { if (adding && adding.length) { adding.pop(); syncAddUI(); } };
  $('btnFinish').onclick = () => finishAdd();
  $('btnCancelAdd').onclick = () => { adding = null; $('btnAddFacet').classList.remove('on'); syncAddUI(); };
  document.querySelectorAll('#nudgeRow [data-n]').forEach(b => b.onclick = () => { const [x, y] = b.dataset.n.split(',').map(Number); nudge(x, y); });
  $('btnSide').onclick = () => { document.body.classList.toggle('side-hidden'); requestAnimationFrame(resize); };
  $('btnFactory').onclick = e => { if (armed(e.currentTarget, '再按一次：全部清除')) factoryReset(); };
  $('btnFactory2').onclick = e => { if (armed(e.currentTarget, '再按一次確認')) factoryReset(); };
  $('btnDelFacet').onclick = () => selFacet && delFacet();
  $('btnClearFacets').onclick = e => { if (armed(e.currentTarget, '再按一次清空')) { S.facets = []; selFacet = null; selVert = null; syncNudge(); saveState(); } };
  $('layerSel').onchange = e => { selLayer = e.target.value; syncLayerUI(); };
  $('btnAddText').onclick = () => { const L = { id: uid(), type: 'text', name: '文字', text: '新文字', stage: 'title', color: '#ffffff', boil: 1, q: [[500, 260], [780, 260], [780, 400], [500, 400]] }; S.layers.push(L); selLayer = L.id; syncLayerUI(); saveState(); };
  $('btnAddImg').onclick = () => $('imgFile').click();
  $('imgFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; const src = await shrinkImage(await readFile(f), 900);
    const [iw, ih] = await imgSize(src), aspect = iw / Math.max(1, ih);
    const L = curLayer();
    // replacing the built-in character keeps its place but takes the new picture's proportions (no stretching)
    if (L && L.type === 'img' && !L.src) { L.src = src; L.q = quadForAspect(L.q, aspect); }
    else { const N = { id: uid(), type: 'img', name: f.name.slice(0, 16), src, stage: 'char', color: '#ffffff', boil: 1, q: quadForAspect([[S.res[0] * 0.4, S.res[1] * 0.3], [S.res[0] * 0.6, S.res[1] * 0.3], [S.res[0] * 0.6, S.res[1] * 0.6], [S.res[0] * 0.4, S.res[1] * 0.6]], aspect, S.res[0] * 0.24) }; S.layers.push(N); selLayer = N.id; }
    syncLayerUI(); saveState();
  };
  $('btnDelLayer').onclick = () => { S.layers = S.layers.filter(l => l.id !== selLayer); selLayer = S.layers[0]?.id || null; syncLayerUI(); saveState(); };
  $('layerText').oninput = e => { const L = curLayer(); if (L) { L.text = e.target.value; saveState(); } };
  $('layerText').onchange = syncLayerUI;
  $('layerColor').oninput = e => { const L = curLayer(); if (L) { L.color = e.target.value; saveState(); } };
  $('layerStage').onchange = e => { const L = curLayer(); if (L) { L.stage = e.target.value; saveState(); } };
  $('layerBoil').oninput = e => { const L = curLayer(); if (L) { L.boil = +e.target.value; saveState(); } };
  $('bpm').oninput = e => { const t = now(), b = t * S.bpm / 60; S.bpm = clamp(+e.target.value || 120, 40, 220); setTime(b * 60 / S.bpm); saveState(); };
  let taps = [];
  $('btnTap').onclick = () => {
    const t = performance.now(); taps = taps.filter(x => t - x < 3000); taps.push(t);
    if (taps.length >= 3) { const iv = (taps[taps.length - 1] - taps[0]) / (taps.length - 1); S.bpm = Math.round(60000 / iv); $('bpm').value = S.bpm; saveState(); }
  };
  $('audioFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    audio.src = URL.createObjectURL(f); audioOn = true;
    ensureCtx(); if (!audio._wired) { const src = actx.createMediaElementSource(audio); attachAnalyser(src); src.connect(actx.destination); audio._wired = true; }
    $('audioInfo').textContent = `已載入：${f.name}（時間軸跟著音樂走，低頻打點會讓畫面閃動）`;
    actx.resume(); play(true);
  };
  $('btnMic').onclick = async () => {
    try { ensureCtx(); const st = await navigator.mediaDevices.getUserMedia({ audio: true }); attachAnalyser(actx.createMediaStreamSource(st)); actx.resume(); $('btnMic').classList.add('on'); $('audioInfo').textContent = '麥克風收音中：大鼓會觸發閃動。'; }
    catch (err) { $('audioInfo').textContent = '無法使用麥克風：' + err.message; }
  };
  $('btnExport').onclick = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }));
    a.download = 'facetstage.json'; a.click();
  };
  $('btnImport').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); if (j.v !== 1) throw new Error('格式不符'); S = j; syncAll(); saveState(); } catch (err) { $('audioInfo').textContent = '匯入失敗：' + err.message; }
  };
  $('btnReset').onclick = e => { if (armed(e.currentTarget, '再按一次覆蓋')) { S = demoState(); selFacet = selLayer = null; selVert = null; syncAll(); syncNudge(); saveState(); } };
  $('btnRec').onclick = () => {
    if (recorder) { recorder.stop(); return; }
    const stream = comp.captureStream(30), chunks = [];
    try { if (audioOn && audio.captureStream) audio.captureStream().getAudioTracks().forEach(tr => stream.addTrack(tr)); } catch (e) {}
    recorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm' });
    recorder.ondataavailable = ev => ev.data.size && chunks.push(ev.data);
    recorder.onstop = () => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = 'facetstage.webm'; a.click();
      recorder = null; $('btnRec').textContent = '錄下畫面（WebM）'; $('btnRec').classList.remove('on');
    };
    recorder.start(); $('btnRec').textContent = '■ 停止並下載'; $('btnRec').classList.add('on');
    if (!clock.playing) { setTime(0); play(true); }
  };
  $('btnPlay').onclick = () => play(!(clock.playing || (audioOn && !audio.paused)));
  $('btnRew').onclick = () => setTime(0);
  $('btnFull').onclick = () => $('stageWrap').requestFullscreen?.();
  $('seek').addEventListener('pointerdown', () => seeking = true);
  $('seek').addEventListener('pointerup', () => seeking = false);
  $('seek').oninput = e => setTime(+e.target.value / 1000 * loopSec());
  syncAll(); setView(VIEW); setEdit('facet'); syncAddUI();
  // phones: start with the settings folded away so the stage gets the whole screen
  if (matchMedia('(max-width:760px)').matches) { document.body.classList.add('narrow', 'side-hidden'); requestAnimationFrame(resize); }
  if (qs.has('play')) play(true);
} else {
  // 投影輸出視窗：雙擊全螢幕，接收主視窗的狀態與時鐘
  view.addEventListener('dblclick', () => document.documentElement.requestFullscreen?.());
  view.style.cursor = 'none';
}
if (bc) bc.onmessage = ev => {
  const m = ev.data || {};
  if (m.kind === 'state' && IS_OUT) { S = m.S; }
  else if (m.kind === 'clock' && IS_OUT) { clock.playing = m.playing; clock.base = m.t + (m.playing ? (Date.now() - m.sent) / 1000 : 0); clock.at = performance.now(); }
  else if (m.kind === 'hello' && !IS_OUT) { broadcast({ kind: 'state', S }); sendClock(); }
};
if (IS_OUT) broadcast({ kind: 'hello' });
setInterval(() => { if (!IS_OUT && clock.playing) sendClock(); }, 2000);

resize();
requestAnimationFrame(frame);
